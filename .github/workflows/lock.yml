name: Check lock files
on:
  push:
    branches:
      - dev
    paths:
      - '**'
      - '!mkdocs.yml'
      - '!docs/**'
      - '!*.md'
  pull_request:
    paths:
      - '**'
      - '!mkdocs.yml'
      - '!docs/**'
      - '!*.md'

jobs:
  check_release_build-gdb-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9  # @v3
    - uses: cachix/install-nix-action@6ed004b9ccb68dbc28e7c85bee15fa93dbd214ac  # @v22
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: build pwndbg
      run: nix build '.#pwndbg' -o result

    - name: simple run pwndbg
      run: ./result/bin/pwndbg <<< 'exit'

  check_release_build-lldb:
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        os: [
          ubuntu-latest,  # x86_64-linux
          macos-13,  # x86_64-darwin
          macos-15,  # aarch64-darwin
        ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9  # @v3
    - uses: cachix/install-nix-action@6ed004b9ccb68dbc28e7c85bee15fa93dbd214ac  # @v22
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: build pwndbg
      run: nix build '.#pwndbg-lldb' -o result

    - name: simple run pwndbg
      run: ./result/bin/pwndbg-lldb <<< 'exit'

  lock_flake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9  # @v3
    - uses: cachix/install-nix-action@6ed004b9ccb68dbc28e7c85bee15fa93dbd214ac  # @v22
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: check flake.lock
      run: nix flake lock --no-update-lock-file

  lock_poetry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9  # @v3
    - uses: cachix/install-nix-action@6ed004b9ccb68dbc28e7c85bee15fa93dbd214ac  # @v22
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: install poetry
      run: nix profile install nixpkgs#poetry

    - name: check poetry.lock
      run: poetry check --lock

