[project]
name = "pwndbg"
version = "2025.10.20"
description = "Exploit Development and Reverse Engineering with GDB Made Easy"
authors = [{ name = "Dominik 'disconnect3d' Czarnota", email = "dominik.b.czarnota+dc@gmail.com" }]
requires-python = ">=3.10, <4"
readme = "README.md"
dependencies = [
    "gdb_for_pwndbg @ https://github.com/pwndbg/pypi-for-pwndbg/releases/download/test-release1/gdb_for_pwndbg-16.3.0.post5-cp313-cp313-manylinux_2_28_x86_64.whl ; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "gdb_for_pwndbg @ https://github.com/pwndbg/pypi-for-pwndbg/releases/download/test-release1/gdb_for_pwndbg-16.3.0.post5-cp313-cp313-manylinux_2_28_aarch64.whl ; platform_system == 'Linux' and platform_machine == 'aarch64'",
    "gdb_for_pwndbg @ https://github.com/pwndbg/pypi-for-pwndbg/releases/download/test-release1/gdb_for_pwndbg-16.3.0.post5-cp313-cp313-manylinux_2_36_loongarch64.whl ; platform_system == 'Linux' and platform_machine == 'loongarch64'",
    "gdb_for_pwndbg @ https://github.com/pwndbg/pypi-for-pwndbg/releases/download/test-release1/gdb_for_pwndbg-16.3.0.post5-cp313-cp313-manylinux_2_28_s390x.whl ; platform_system == 'Linux' and platform_machine == 's390x'",
    "gdb_for_pwndbg @ https://github.com/pwndbg/pypi-for-pwndbg/releases/download/test-release1/gdb_for_pwndbg-16.3.0.post5-cp313-cp313-manylinux_2_39_riscv64.whl ; platform_system == 'Linux' and platform_machine == 'riscv64'",
    "gdb_for_pwndbg @ https://github.com/pwndbg/pypi-for-pwndbg/releases/download/test-release1/gdb_for_pwndbg-16.3.0.post5-cp313-cp313-manylinux_2_28_ppc64le.whl ; platform_system == 'Linux' and platform_machine == 'ppc64le'",
    "gdb_for_pwndbg @ https://github.com/pwndbg/pypi-for-pwndbg/releases/download/test-release1/gdb_for_pwndbg-16.3.0.post5-cp313-cp313-manylinux_2_31_armv7l.whl ; platform_system == 'Linux' and platform_machine == 'armv7l'",
    "gdb_for_pwndbg @ https://github.com/pwndbg/pypi-for-pwndbg/releases/download/test-release1/gdb_for_pwndbg-16.3.0.post5-cp313-cp313-manylinux_2_28_i686.whl ; platform_system == 'Linux' and platform_machine == 'i686'",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["A003", "E402", "E501", "E731", "F405", "F821", "W505"]

select = [
    "A",      # flake8-builtins
    "E",      # pycodestyle
    "F",      # pyflakes
    "W",      # pycodestyle
    "C4",     # flake8-comprehensions
    "ISC",    # flake8-implicit-str-concat
    "SLOT",   # flake8-slots
    "FLY",    # flynt
    "PGH",    # pygrep-hooks
    "RET506", # flake8-return: superfluous-else-raise
    "RET507", # flake8-return: superfluous-else-continue
    "RET508", # flake8-return: superfluous-else-break
    # We want to enable the below lints, but they currently return too many errors
    # "RET505", # flake8-return: superfluous-else-return
    # "SLF" # flake8-self
    # "SIM", # flake8-simplify
    # "PTH", # flake8-use-pathlib
]

[tool.uv]
default-groups = []

[tool.uv.sources]
pt = { git = "https://github.com/martinradev/gdb-pt-dump", rev = "50227bda0b6332e94027f811a15879588de6d5cb" }

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = [
    "all",
    "bin",
    "breakpoint",
    "copyright",
    "dir",
    "exit",
    "format",
    "hex",
    "map",
    "max",
    "min",
    "next",
    "type",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["/pwndbg", "/pwndbginit"]

[tool.hatch.build.targets.wheel]
include = ["/pwndbg", "/pwndbginit"]

[project.scripts]
pwndbg = "pwndbginit.pwndbg_gdb:main"
pwndbg-lldb = "pwndbginit.pwndbg_lldb:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
strict_optional = false
check_untyped_defs = true
allow_untyped_globals = false
allow_redefinition = true
allow_any_generics = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
# warn_return_any = true
# warn_unreachable = true
show_error_context = true
pretty = true
show_error_codes = true
incremental = false
disable_error_code = [
    # https://github.com/python/mypy/issues/6232
    "assignment",
]

[[tool.mypy.overrides]]
module = ["pwndbg.aglib.elf"]
disable_error_code = ["name-defined"]

[[tool.mypy.overrides]]
module = [
    "pwndbg.aglib.arch",
    "pwndbg.color.*",
    "pwndbg.commands.context",
    "pwndbg.commands.cymbol",
    "pwndbg.commands.hexdump",
    "pwndbg.commands.procinfo",
    "pwndbg.commands.reload",
    "pwndbg.commands.version",
    "pwndbg.exception",
    "pwndbg.aglib.dynamic",
    "pwndbg.gdblib.events",
    "pwndbg.gdblib.got",
    "pwndbg.gdblib.ptmalloc2_tracking",
    "pwndbg.aglib.heap.*",
    "pwndbg.hexdump",
    "pwndbg.ui",
    "pwndbg.wrappers.*",
]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["pwndbg.commands.telescope"]
disable_error_code = ["attr-defined", "index"]

[[tool.mypy.overrides]]
module = ["pwndbg.aglib.kernel.nftables"]
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = [
    "pwndbg.aglib.nearpc",
    "pwndbg.aglib.typeinfo",
]
disable_error_code = ["name-defined", "attr-defined"]

[[tool.mypy.overrides]]
module = ["pwndbg.aglib.disasm.*"]
disable_error_code = ["index", "name-defined", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "capstone.*",
    "unicorn.*",
    "pwnlib.*",
    "ropgadget.*",
    "elftools.*",
    "ipdb.*",
    "r2pipe",
    "rzpipe",
    "rich.*",
    "pt.*",
    "lldb.*",
    "gnureadline",
    "lief",
]
ignore_missing_imports = true

[tool.isort]
profile = "black"
force_single_line = true
known_third_party = [
    "capstone",
    "unicorn",
    "pycparser",
    "gdb",
    "lldb",
]
add_imports = "from __future__ import annotations"

[tool.coverage.run]
branch = true
parallel = true
disable_warnings = ["module-not-imported"]
source = ["${SRC_DIR-.}"]
omit = ["ida_script.py"]
data_file = ".cov/coverage"

[tool.coverage.report]
omit = ["ida_script.py", "tests/*"]
